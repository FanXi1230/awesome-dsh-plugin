name: FanXi1230/fanxi#dsh-reasoning-effort-dock
category: ui
description:
  en: Adds a draggable Off / Low / High / Max reasoning-effort slider to the composer model row and applies the selected level to the current DSH session. The slider only appears for models that offer all four effort levels.
  zh: 在输入框模型栏加入可拖拽吸附的 Off / Low / High / Max 推理强度滑轨，并把选中档位应用到当前 DSH 会话。仅在模型同时提供这四个推理档位时才会显示滑轨。
